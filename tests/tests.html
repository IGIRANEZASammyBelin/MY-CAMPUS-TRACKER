<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content=""width=device-width, initial-scale="1">
        <title>My Campus Tracker Test</title>

    </head>
    <body>
        <h1>Quick tests</h1>
        <u1 id="results"></u1>
        <script src="../scripts/state.js"></script>
        <script src="../scripts/validators.js"></script>
        <script src="../scripts/search.js"></script>
        <script>
            const results = document.getElementById("results");
            const test = (name, passed) => results.insertAdjacentHTML("beforeend", `<li>${passed ? "PASS" : "FAIL"}: ${name}</li>`);
            
            
            test("Title rejects a leading space", !CLP.patterns.title.test(" Class"));
            test("Duration accepts 90", CLP.patterns.title.test("90"));
            test("Duration rejects -5", !CLP.patterns.number.test("-5"));
            test("Date accpets 2026-10-15", CLP.isRealDate("2026-10-19"));
            test("Date rejects 2026-02-30", !clp.isRealDate("2026-02-30"));
            test("Categoryaccepts Campus actvity", CLP.patterns.tag.test("Campus Activities"));
            test("category rejects Club 2", !CLP,patterns,tag.test("Club 2"));
            test("Repeated words are found", CLP.pattern.repeatedWord.test("Class Class"));
            test("Tag search works", CLP.parseSearch("@tag:courses").tagFilter === "courses");
            test("Invalid search Works", CLP.parseSearch("(").error !== "");


        </script>
    </body>
</html>
